name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", "game/**", "data/**", "art/audio/**", "art/fonts/**", "bin/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "game/**", "data/**", "art/audio/**", "art/fonts/**", "bin/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows runtime + tests
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
          filter: blob:none
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install sccache
        # Pinned release binary from the official action; it is faster than choco. The download is the one step
        # here that depends on a service we do not run, so a failure costs speed, not correctness.
        id: sccache-action
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        shell: pwsh
        run: |
          $installed = [bool](Get-Command sccache -ErrorAction SilentlyContinue)
          if (-not $installed -and $env:SCCACHE_PATH -and (Test-Path $env:SCCACHE_PATH)) {
            Split-Path $env:SCCACHE_PATH | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $installed = $true
          }
          foreach ($attempt in 1..3) {
            if ($installed) { break }
            choco install sccache -y --no-progress
            # Chocolatey can report success after installing nothing, so look for the program itself.
            $installed = [bool](Get-Command sccache -ErrorAction SilentlyContinue)
            if (-not $installed) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if ($installed) {
            "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SCCACHE_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "::warning::sccache could not be installed, building without a compiler cache"
          }
          exit 0 # the last choco run may have left a failing exit code behind
      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset windows-ci
        working-directory: engine
      - name: Build
        run: cmake --build --preset windows-ci
        working-directory: engine
      - name: Compiler cache stats
        if: env.SCCACHE_READY == '1'
        run: sccache --show-stats
      - name: Test
        run: ctest --preset windows-ci
        working-directory: engine
      - name: Headless smoke run
        run: python ../tools/check_smoke_hash.py build/windows-ci/app/ichor.exe
        working-directory: engine

  linux-headless:
    name: linux headless + sanitizers
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache mesa-vulkan-drivers libvulkan1 vulkan-tools autoconf autoconf-archive automake libtool pkg-config
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Test
        run: ctest --preset linux-headless-asan
        working-directory: engine
      - name: Configure GPU goldens
        run: cmake --preset linux-gpu
        working-directory: engine
      - name: Build GPU goldens
        run: cmake --build --preset linux-gpu
        working-directory: engine
      - name: GPU goldens on lavapipe
        # Software Vulkan (lavapipe), so the 28 golden image cases compare here instead of skipping. The software
        # set under tests/data/golden/software overrides a golden that a real GPU draws differently.
        env:
          ICHOR_GOLDEN_SOFTWARE: "1"
          ICHOR_REQUIRE_GPU: "1"
          ICHOR_GOLDEN_REPORT: "1"
        run: |
          vulkaninfo --summary
          ctest --preset linux-gpu
        working-directory: engine
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-golden-output
          path: engine/build/linux-gpu/test-output
          if-no-files-found: ignore
