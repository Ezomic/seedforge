name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows runtime + tests
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install sccache
        run: choco install sccache -y --no-progress
      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset windows-ci
        working-directory: engine
      - name: Build
        run: cmake --build --preset windows-ci
        working-directory: engine
      - name: Compiler cache stats
        run: sccache --show-stats
      - name: Test
        run: ctest --preset windows-ci
        working-directory: engine
      - name: Headless smoke run
        run: ./build/windows-ci/app/ichor.exe --headless --frames 120
        working-directory: engine

  linux-headless:
    name: linux headless + sanitizers
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Test
        run: ctest --preset linux-headless-asan
        working-directory: engine
