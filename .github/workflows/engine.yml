name: engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "game/**", "data/**", "art/audio/**", "art/fonts/**", "bin/**", "tools/package_linux.sh", ".github/workflows/engine.yml", ".github/workflows/nightly.yml"]
  # No path filter on a pull request: the required checks must report on every PR, and the `changes` job decides what runs (SEED-548).
  pull_request:

# A new push to a PR cancels the run of the previous commit; runs on main queue and none is cancelled.
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Test tiers (SEED-664, SEED-672), kept in engine/tests/test_tiers.json and applied as ctest labels:
#   fast    the PR sanitizer check (the linux shards below)
#   medium  the Windows Release job on a PR; the sanitizer shards on main (push) and in the nightly
#   soak    the full variant of a heavy test: the `linux soak tests` job on main and the nightly, never on a PR
# Every required PR check has a 15 minute timeout. docs/ci-coverage.md has the arithmetic.
env:
  # builtin-baseline of engine/vcpkg.json. Checking out vcpkg master gave every run a new ABI hash, so the binary cache restored
  # 0 packages and each job rebuilt every dependency (configure took 190 to 320 s).
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc

jobs:
  changes:
    # Decides the scope of the PR from its changed paths. `heavy` is everything as before the split; `art` adds the Windows art tests.
    # Anything not named as light below is heavy, so a new top-level folder runs the full suite until it is classified here.
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      art: ${{ steps.scope.outputs.art }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          heavy=true
          art=false
          if [ "$EVENT" = pull_request ]; then
            heavy=false
            # The checkout is the merge commit: its first parent is the base, so this is exactly the PR's diff. Renames count as delete + add.
            git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD > changed.txt
            cat changed.txt
            while IFS= read -r f; do
              case "$f" in
                art/audio/*|art/fonts/*) heavy=true ;;
                art/*) art=true ;;
                tools/check_smoke_hash.py|tools/test_times.py|tools/test_time_allowlist.json|tools/ci_tiers.py) heavy=true ;;
                docs/*|tools/*) ;;
                */*) heavy=true ;;
                *.md) ;;
                *) heavy=true ;;
              esac
            done < changed.txt
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "art=$art" >> "$GITHUB_OUTPUT"
          echo "scope: heavy=$heavy art=$art (event: $EVENT)"

  light:
    # The python checks of the ctest suite, run directly. About 30 s, on every PR, so a docs or tools only change is still checked.
    name: python tools + content layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Content layout
        run: |
          python3 tools/check_content_layout.py --root .
          python3 tools/check_content_layout.py --self-test
      - name: Data lint and dependency policy
        run: |
          python3 tools/check_data.py --root .
          python3 tools/check_data.py --self-test
          python3 tools/check_deps.py --root .
          python3 tools/check_deps.py --root . --self-test
      - name: Dialogue coverage
        run: |
          python3 tools/dialogue_coverage.py --root . --report dialogue-coverage.md
          python3 tools/dialogue_coverage.py --self-test
        # The report is the readable output; it lands in the job summary even when the gate fails.
      - name: Dialogue coverage report
        if: always()
        run: '[ -f dialogue-coverage.md ] && cat dialogue-coverage.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Test tiers and time budget tools
        run: |
          python3 tools/ci_tiers.py --root . check
          python3 tools/test_times.py --check-allowlist --root .
          python3 tools/test_times.py --self-test
          python3 tools/ci_time_trend.py --self-test
          python3 tools/package_size.py --self-test
          python3 tools/golden_diff_page.py --self-test
          python3 tools/art_contact_sheet.py --self-test
          python3 tools/axiom_sweep.py --self-test

  art-sheet:
    # A page of the changed assets under art/, uploaded as an artifact so art is reviewed without a build (SEED-709). Only the shown
    # LFS objects are fetched; the GLB previews load <model-viewer> from a CDN when the page is opened.
    name: art contact sheet
    needs: changes
    if: needs.changes.outputs.art == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
      - name: Build the contact sheet
        run: |
          git lfs install --local
          python3 tools/art_contact_sheet.py --base "$(git rev-parse --short HEAD^1)" --head "$(git rev-parse --short HEAD)" --out art-contact-sheet
      - uses: actions/upload-artifact@v4
        with:
          name: art-contact-sheet
          path: art-contact-sheet
          retention-days: 14

  windows:
    # Not the required name: `windows runtime + tests` below is the aggregator. This job runs the whole suite when `heavy`, and only the
    # tests that load art/ when the PR changes art and nothing else the suite covers.
    name: windows build + tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true' || needs.changes.outputs.art == 'true'
    runs-on: windows-2022
    # PR_LIMIT: 15 minutes, the budget of a pull request (the first number in these expressions, three jobs). Raise it to 30 after a cache
    # eviction or a key rename until a run on main has saved the caches again: a cold PR run needs about 25 minutes and a job killed by its
    # limit saves nothing. A run on main starts with cold caches (a cache saved on a PR branch is not visible to main) and
    # a job killed by its limit saves no cache, so main gets room to finish once and warm them.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      # vcpkg hashes the version of the pwsh it runs into every package ABI. With this set it ignores the runner's pwsh (which
      # changes with the runner image, two versions coexist during a rollout) and uses the one pinned by VCPKG_COMMIT, so the
      # same binary cache is warm on every image (SEED-740). cmake, ninja and git are pinned the same way.
      VCPKG_FORCE_DOWNLOADED_BINARIES: "1"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
          filter: blob:none
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Use the vcpkg checkout, not the copy bundled with Visual Studio
        # vcvars64 exports VCPKG_ROOT pointing at VS's own vcpkg copy and the step above forwards it, which silently replaced the
        # checkout at VCPKG_COMMIT: that copy's tool pins (cmake 3.30.1, pwsh 7.5.3) do not match the baseline's ports (SEED-740).
        shell: pwsh
        run: '"VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Install sccache
        # Pinned release binary from the official action; it is faster than choco. The download is the one step
        # here that depends on a service we do not run, so a failure costs speed, not correctness.
        id: sccache-action
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        shell: pwsh
        run: |
          $installed = [bool](Get-Command sccache -ErrorAction SilentlyContinue)
          if (-not $installed -and $env:SCCACHE_PATH -and (Test-Path $env:SCCACHE_PATH)) {
            Split-Path $env:SCCACHE_PATH | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $installed = $true
          }
          foreach ($attempt in 1..3) {
            if ($installed) { break }
            choco install sccache -y --no-progress
            # Chocolatey can report success after installing nothing, so look for the program itself.
            $installed = [bool](Get-Command sccache -ErrorAction SilentlyContinue)
            if (-not $installed) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if ($installed) {
            "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SCCACHE_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "::warning::sccache could not be installed, building without a compiler cache"
          }
          exit 0 # the last choco run may have left a failing exit code behind
      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-
      - name: Toolchain identity for the vcpkg cache
        # vcpkg hashes cl.exe into every package ABI, so a runner image with a new compiler restores 0 packages. Keying on it makes
        # that a cache miss that saves a fresh set, instead of a hit that never re-saves (SEED-716). The pwsh version is no longer
        # part of the key: vcpkg uses its own pinned pwsh (VCPKG_FORCE_DOWNLOADED_BINARIES above), logged here next to the runner's.
        id: toolchain
        shell: pwsh
        run: |
          $cl = (Get-FileHash (Get-Command cl.exe).Source -Algorithm SHA256).Hash.Substring(0, 16)
          "id=cl$cl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "runner pwsh $($PSVersionTable.PSVersion), cl.exe $cl"
          $vcpkgPwsh = (& ./vcpkg/vcpkg.exe fetch powershell-core | Select-Object -Last 1)
          Write-Host "vcpkg pwsh $vcpkgPwsh ($(& $vcpkgPwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'))"
      - name: Restore vcpkg binaries
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-v4-${{ steps.toolchain.outputs.id }}-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-windows-v4-${{ steps.toolchain.outputs.id }}-
      - name: Restore forged world test cache
        id: cache2
        # Keyed on the sources the test cache digest hashes (engine/tests/forged_cache_digest.cmake), so a generator change starts cold.
        uses: actions/cache/restore@v4
        with:
          path: engine/build/windows-ci/forged-world-cache
          key: forged-cache-windows-${{ hashFiles('libworldforge/include/**', 'libworldforge/src/**', 'engine/world/include/ichor/world/forged_heightfield.h', 'engine/world/src/forged_heightfield.cpp', 'engine/world/include/ichor/world/forged_world_cache.h', 'engine/world/src/forged_world_cache.cpp', 'engine/world/include/ichor/world/forged_phase_maps.h', 'engine/world/src/forged_phase_maps.cpp', 'engine/world/include/ichor/world/heightfield.h', 'engine/world/src/heightfield.cpp', 'engine/world/include/ichor/world/world_desc.h', 'engine/core/include/ichor/core/binary.h', 'engine/core/include/ichor/core/hash.h') }}
      - name: Configure
        id: configure
        run: cmake --preset windows-ci
        working-directory: engine
      - name: Save vcpkg binaries
        # Saved right after configure: a cold configure takes about 9 minutes, and a job killed later by its 15 minute limit saves nothing.
        # Only a configure that finished saves: a cancelled or failed one leaves a partial set, and a partial set under the exact key is
        # restored as a hit, never re-saved, and makes every later run rebuild the missing ports.
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-v4-${{ steps.toolchain.outputs.id }}-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
      - name: Build
        if: needs.changes.outputs.heavy == 'true'
        run: cmake --build --preset windows-ci
        working-directory: engine
      - name: Build the art tests
        if: needs.changes.outputs.heavy != 'true'
        # The three executables that hold the art-loading tests (and what they depend on), not the engine runtime.
        run: cmake --build --preset windows-ci --target ichor_tests_ui ichor_tests_world stage0_tests
        working-directory: engine
      - name: Compiler cache stats
        if: env.SCCACHE_READY == '1'
        run: sccache --show-stats
      - name: Test
        if: needs.changes.outputs.heavy == 'true'
        # fast + medium: the preset leaves out the soak label
        run: ctest --preset windows-ci
        working-directory: engine
      - name: Art tests
        if: needs.changes.outputs.heavy != 'true'
        # Every test that opens a file under art/ (docs/ci-coverage.md lists them): the cooker, the Exile mesh, rig and avatar,
        # the Bull-Warden, the exported settlement kit and the content layout. --no-tests=error: a rename must not leave this empty.
        shell: bash
        run: |
          ctest --preset windows-ci --no-tests=error -R 'Exile|cooker|bundle round-trips|reading garbage|mip chains|Bull-Warden|exported GLBs|content_layout'
          build/windows-ci/tests/ichor_tests_ui.exe "[exile]"
        working-directory: engine
      - name: Test time budget
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: python ../tools/test_times.py build/windows-ci/Testing/Temporary/LastTest.log --profile release
        working-directory: engine
      - name: Headless smoke run
        if: needs.changes.outputs.heavy == 'true'
        run: python ../tools/check_smoke_hash.py build/windows-ci/app/ichor.exe
        working-directory: engine
      - name: Bridge corpus replay
        # The 20 recorded fights of game/combat_bridge/tests/corpus (SEED-659) replayed against their files; the report is compared with the
        # Linux one in `linux headless + sanitizers` (SEED-743). About 3 s in Release.
        if: needs.changes.outputs.heavy == 'true'
        run: build/windows-ci/combat_bridge/combat_bridge_corpus.exe --replay bridge-corpus-windows.txt
        working-directory: engine
      - name: Upload bridge corpus report
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-corpus-windows
          path: engine/bridge-corpus-windows.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Save sccache
        # Only main saves a compiler cache: a per-commit entry from every PR run filled the 10 GB cache limit (SEED-688).
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
      - name: Save forged world test cache
        # Saved even when a later step fails, so a failed first run still warms the cache (actions/cache only saves on success).
        if: ${{ always() && steps.cache2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: engine/build/windows-ci/forged-world-cache
          key: forged-cache-windows-${{ hashFiles('libworldforge/include/**', 'libworldforge/src/**', 'engine/world/include/ichor/world/forged_heightfield.h', 'engine/world/src/forged_heightfield.cpp', 'engine/world/include/ichor/world/forged_world_cache.h', 'engine/world/src/forged_world_cache.cpp', 'engine/world/include/ichor/world/forged_phase_maps.h', 'engine/world/src/forged_phase_maps.cpp', 'engine/world/include/ichor/world/heightfield.h', 'engine/world/src/heightfield.cpp', 'engine/world/include/ichor/world/world_desc.h', 'engine/core/include/ichor/core/binary.h', 'engine/core/include/ichor/core/hash.h') }}

  windows-required:
    # The required check keeps its name. It passes when the Windows job ran and passed, or when no heavy or art change made it needed.
    name: windows runtime + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, light, windows]
    if: always()
    steps:
      - name: The Windows job passed or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          LIGHT: ${{ needs.light.result }}
          WINDOWS: ${{ needs.windows.result }}
          NEEDED: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.outputs.art == 'true' }}
        run: |
          echo "changes: $CHANGES, python checks: $LIGHT, windows: $WINDOWS, windows needed: $NEEDED"
          test "$CHANGES" = success && test "$LIGHT" = success
          if [ "$NEEDED" = true ]; then test "$WINDOWS" = success; else test "$WINDOWS" = skipped; fi

  linux-shard:
    name: linux sanitizers shard ${{ matrix.shard }} of 4
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # Warm caches finish in 4 to 8 minutes. A cold ccache compiles the whole ASan tree in 12 to 25 minutes, and on main the shards also run
    # the medium tier. A job killed by its limit saves no cache, so only a pull request is held to 15 minutes.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # A PR runs the fast tier under ASan/UBSan; main runs fast + medium. Each shard takes every fourth test.
      TEST_PRESET: ${{ github.event_name == 'pull_request' && 'linux-headless-asan-fast' || 'linux-headless-asan' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache autoconf autoconf-archive automake libtool libltdl-dev pkg-config
      - name: Restore vcpkg binaries
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-v2-
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Restore forged world test cache
        id: cache2
        uses: actions/cache/restore@v4
        with:
          path: engine/build/linux-headless-asan/forged-world-cache
          key: forged-cache-linux-asan-${{ matrix.shard }}-${{ hashFiles('libworldforge/include/**', 'libworldforge/src/**', 'engine/world/include/ichor/world/forged_heightfield.h', 'engine/world/src/forged_heightfield.cpp', 'engine/world/include/ichor/world/forged_world_cache.h', 'engine/world/src/forged_world_cache.cpp', 'engine/world/include/ichor/world/forged_phase_maps.h', 'engine/world/src/forged_phase_maps.cpp', 'engine/world/include/ichor/world/heightfield.h', 'engine/world/src/heightfield.cpp', 'engine/world/include/ichor/world/world_desc.h', 'engine/core/include/ichor/core/binary.h', 'engine/core/include/ichor/core/hash.h') }}
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Save ccache
        # Right after the build, so a test failure or timeout does not throw away a cold compile.
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
      - name: Test (shard ${{ matrix.shard }} of 4)
        run: ctest --preset "$TEST_PRESET" -I ${{ matrix.shard }},,4
        working-directory: engine
      - name: Test time budget
        if: always()
        run: python3 ../tools/test_times.py build/linux-headless-asan/Testing/Temporary/LastTest.log --profile sanitizer
        working-directory: engine
      - name: Bridge corpus replay
        # The 20 recorded fights of game/combat_bridge/tests/corpus replayed under the sanitizers on every PR too (the ctest case is medium
        # tier, so the fast preset leaves it out); `linux headless + sanitizers` compares the report with the Windows one (SEED-743).
        # About 60 s under ASan, on the shard that finished first in the baseline runs.
        if: matrix.shard == 2
        run: build/linux-headless-asan/combat_bridge/combat_bridge_corpus --replay bridge-corpus-linux.txt
        working-directory: engine
      - name: Upload bridge corpus report
        if: ${{ always() && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-corpus-linux
          path: engine/bridge-corpus-linux.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Save vcpkg binaries
        # Saved even when a later step fails, so a failed first run still warms the cache (actions/cache only saves on success).
        if: ${{ always() && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
      - name: Save forged world test cache
        # Saved even when a later step fails, so a failed first run still warms the cache (actions/cache only saves on success).
        if: ${{ always() && steps.cache2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: engine/build/linux-headless-asan/forged-world-cache
          key: forged-cache-linux-asan-${{ matrix.shard }}-${{ hashFiles('libworldforge/include/**', 'libworldforge/src/**', 'engine/world/include/ichor/world/forged_heightfield.h', 'engine/world/src/forged_heightfield.cpp', 'engine/world/include/ichor/world/forged_world_cache.h', 'engine/world/src/forged_world_cache.cpp', 'engine/world/include/ichor/world/forged_phase_maps.h', 'engine/world/src/forged_phase_maps.cpp', 'engine/world/include/ichor/world/heightfield.h', 'engine/world/src/heightfield.cpp', 'engine/world/include/ichor/world/world_desc.h', 'engine/core/include/ichor/core/binary.h', 'engine/core/include/ichor/core/hash.h') }}

  linux-gpu:
    name: linux gpu goldens
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # Cold, this job builds SDL3 and friends from source (670 to 737 s of configure), so only a pull request is held to 15 minutes.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers autoconf autoconf-archive automake libtool libltdl-dev pkg-config
      - name: Restore vcpkg binaries
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-gpu-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: |
            vcpkg-linux-gpu-v2-
            vcpkg-linux-v2-
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gpu-${{ github.sha }}
          restore-keys: ccache-gpu-
      - name: Configure GPU goldens
        run: cmake --preset linux-gpu
        working-directory: engine
      - name: Build GPU goldens
        run: cmake --build --preset linux-gpu
        working-directory: engine
      - name: Save ccache
        # Right after the build, so a test failure or timeout does not throw away a cold compile.
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gpu-${{ github.sha }}
      - name: GPU goldens on lavapipe
        # Software Vulkan (lavapipe), so the 28 golden image cases compare here instead of skipping. The software
        # set under tests/data/golden/software overrides a golden that a real GPU draws differently.
        # The Khronos validation layer is loaded from the environment and only prints errors, which do not fail a test by
        # themselves, so the step counts them per VUID in the verbose ctest log and fails on any. The validation canary
        # case makes exactly one deliberate error, so a layer that silently stops loading fails the step too.
        env:
          ICHOR_GOLDEN_SOFTWARE: "1"
          ICHOR_REQUIRE_GPU: "1"
          ICHOR_GOLDEN_REPORT: "1"
          ICHOR_VALIDATION_CANARY: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_SETTINGS_PATH: ${{ runner.temp }}/vk_layer_settings.txt
        run: |
          printf '%s\n' 'khronos_validation.report_flags = error' 'khronos_validation.debug_action = VK_DBG_LAYER_ACTION_LOG_MSG' > "$VK_LAYER_SETTINGS_PATH"
          vulkaninfo --summary
          set -o pipefail
          status=0
          ctest --preset linux-gpu -V | tee "$RUNNER_TEMP/ctest.log" || status=$?
          grep 'Validation Error' "$RUNNER_TEMP/ctest.log" | sed -E 's/.*(VUID-[A-Za-z0-9_-]+|UNASSIGNED-[A-Za-z0-9_.-]+).*/\1/' | sort | uniq -c || true
          canary='VUID-VkSamplerCreateInfo-maxLod-01973'
          if [ "$(grep -c "Validation Error: \[ $canary \]" "$RUNNER_TEMP/ctest.log")" != 1 ]; then
            echo "::error::the validation canary did not report exactly once, so the layer is not reaching the tests"
            exit 1
          fi
          if grep 'Validation Error' "$RUNNER_TEMP/ctest.log" | grep -qv "$canary"; then
            echo "::error::Vulkan validation errors (counts per VUID above)"
            exit 1
          fi
          exit $status
        working-directory: engine
      - name: Golden diff page
        # A failed golden case leaves its expected, actual and diff pictures in test-output/golden-failures. Only on a
        # failed job, so a green run spends nothing here, and an empty folder writes no page and uploads nothing.
        if: failure()
        run: python3 tools/golden_diff_page.py engine/build/linux-gpu/test-output/golden-failures
      - name: Upload golden diff page
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: engine/build/linux-gpu/test-output/golden-failures
          if-no-files-found: ignore
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-golden-output
          path: engine/build/linux-gpu/test-output
          if-no-files-found: ignore
      - name: Save vcpkg binaries
        # Saved even when a later step fails, so a failed first run still warms the cache (actions/cache only saves on success).
        if: ${{ always() && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-gpu-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}

  linux-headless:
    # The required check keeps its name. When the PR is heavy it passes only if every shard and the GPU goldens passed (a skipped or
    # cancelled one fails it); otherwise the shards are skipped on purpose and it passes once the `changes` job did.
    name: linux headless + sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `windows` is needed only for its bridge corpus report (SEED-743); whether that job passed stays the business of `windows runtime + tests`.
    needs: [changes, linux-shard, linux-gpu, windows]
    if: always()
    steps:
      - name: Every Linux job passed or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.linux-shard.result }}
          GPU: ${{ needs.linux-gpu.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          echo "changes: $CHANGES, heavy: $HEAVY, shards: $SHARDS, gpu goldens: $GPU"
          test "$CHANGES" = success
          if [ "$HEAVY" = true ]; then test "$SHARDS" = success && test "$GPU" = success; else test "$SHARDS" = skipped && test "$GPU" = skipped; fi
      - name: Download the bridge corpus reports
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-corpus-*
          path: bridge-corpus
      - name: The bridge corpus replays the same on Windows and Linux
        # Both reports hold one line per fight with the world hash, the recorded outcome and the replayed one. A platform whose
        # replay disagrees with the files has already failed its own job; this step fails when the two platforms disagree with each other,
        # which the files alone cannot show once a world moved and every fight was re-picked.
        if: needs.changes.outputs.heavy == 'true'
        run: |
          windows=bridge-corpus/bridge-corpus-windows/bridge-corpus-windows.txt
          linux=bridge-corpus/bridge-corpus-linux/bridge-corpus-linux.txt
          for f in "$windows" "$linux"; do
            [ -s "$f" ] || { echo "::error::$f is missing: the job that writes it did not get to its Bridge corpus replay step"; exit 1; }
          done
          lines=$(wc -l < "$linux")
          if diff -u "$windows" "$linux"; then
            echo "the $lines bridge fights replay to the same outcome on Windows and Linux"
          else
            echo "::error::the bridge corpus replays differently on Windows and Linux (the diff above; - is Windows, + is Linux)"
            exit 1
          fi

  linux-soak:
    # Not a PR check: the full variants of the heavy tests under the sanitizers, on every merge to main (nightly.yml runs them too).
    name: linux soak tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache autoconf autoconf-archive automake libtool libltdl-dev pkg-config
      - name: Restore vcpkg binaries
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-v2-
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Save ccache
        # Right after the build, so a test failure or timeout does not throw away a cold compile.
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
      - name: Soak tests
        run: ctest --preset linux-headless-asan-soak
        working-directory: engine
      - name: Save vcpkg binaries
        # Saved even when a later step fails, so a failed first run still warms the cache (actions/cache only saves on success).
        if: ${{ always() && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}

  linux-package:
    # Not a PR check and not part of `linux headless + sanitizers`: the Linux counterpart of bin/package (SEED-663). On every merge to main it builds the app
    # with the linux-gpu preset (the only Linux preset with ENGINE_RUNTIME on), packs tools/package_linux.sh's tarball, unpacks it in a fresh folder and runs
    # the unpacked binary --headless from another directory. Warm it takes about 2.5 minutes; cold it builds SDL3 and the renderer, hence no PR run.
    name: linux package + smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache mesa-vulkan-drivers libvulkan1 autoconf autoconf-archive automake libtool libltdl-dev pkg-config
      - name: Restore vcpkg binaries
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-gpu-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: |
            vcpkg-linux-gpu-v2-
            vcpkg-linux-v2-
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-package-${{ github.sha }}
          restore-keys: |
            ccache-package-
            ccache-gpu-
      - name: Package and smoke run
        run: tools/package_linux.sh --smoke --out "$RUNNER_TEMP/dist/ichor-linux"
      - name: Save ccache
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-package-${{ github.sha }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ichor-linux-package
          path: ${{ runner.temp }}/dist/ichor-linux.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Package size budget
        # After the upload, so a package over budget can still be downloaded and inspected (SEED-708).
        run: python3 tools/package_size.py "$RUNNER_TEMP/dist/ichor-linux.tar.gz"
      - name: Save vcpkg binaries
        if: ${{ always() && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-gpu-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
