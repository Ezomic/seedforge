name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows runtime + tests
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install sccache
        # The download is the one step here that depends on a service we do not run. A failed install costs
        # speed, not correctness: retry, and only switch the compiler cache on once it is really there.
        shell: pwsh
        run: |
          $installed = $false
          foreach ($attempt in 1..3) {
            choco install sccache -y --no-progress
            # Chocolatey can report success after installing nothing, so look for the program itself.
            if (Get-Command sccache -ErrorAction SilentlyContinue) { $installed = $true; break }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if ($installed) {
            "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SCCACHE_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "::warning::sccache could not be installed, building without a compiler cache"
          }
          exit 0 # the last choco run may have left a failing exit code behind
      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset windows-ci
        working-directory: engine
      - name: Build
        run: cmake --build --preset windows-ci
        working-directory: engine
      - name: Compiler cache stats
        if: env.SCCACHE_READY == '1'
        run: sccache --show-stats
      - name: Test
        run: ctest --preset windows-ci
        working-directory: engine
      - name: Headless smoke run
        run: ./build/windows-ci/app/ichor.exe --headless --frames 120
        working-directory: engine

  linux-headless:
    name: linux headless + sanitizers
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Test
        run: ctest --preset linux-headless-asan
        working-directory: engine
