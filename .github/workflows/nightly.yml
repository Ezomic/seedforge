name: nightly

# Not a required check and not path filtered: it runs on a schedule (and by hand) against main to catch what a single
# green PR run cannot, namely tests that only fail under parallel random-order execution and world generator
# changes that push a fixed set of seeds over a design check. See docs/ci-coverage.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: ctest-stress rounds
        default: "3"
      size:
        description: forge-cli grid size for the sanity report
        default: "128"
      walk_grids:
        description: forged walk bot grid sizes, comma separated
        default: "256,1024"

jobs:
  ci-time-trend:
    # Per-job durations of the recent PR runs of engine.yml, red when a job's median passes 12 of its 15 minutes (SEED-702).
    name: PR CI time trend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: tools
      - name: Job durations of recent PR runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/ci_time_trend.py --repo "${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"

  stress-and-sanity:
    name: ctest-stress + world sanity (linux headless)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      STRESS_ROUNDS: ${{ inputs.rounds || '3' }}
      SANITY_SIZE: ${{ inputs.size || '128' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-v2-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: ctest-stress
        id: stress
        run: |
          set -o pipefail
          bin/ctest-stress -p linux-headless-asan -n "$STRESS_ROUNDS" | tee stress.log
      - name: World sanity report (seeds 1-8)
        id: sanity
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/world_sanity.py engine/build/linux-headless-asan/forge-cli/ichor_forge_cli \
            --seeds 1-8 --size "$SANITY_SIZE" --out world-sanity | tee sanity.log
      - name: Summarize failures
        if: ${{ failure() }}
        run: |
          {
            echo "## Nightly failures"
            if [ "${{ steps.stress.outcome }}" = "failure" ]; then
              echo "### ctest-stress: flaky or failing tests (failure count per test)"
              echo '```'
              sed -n '/failures per test:/,$p' stress.log
              echo '```'
            fi
            if [ "${{ steps.sanity.outcome }}" = "failure" ]; then
              echo "### World sanity: failing seeds and design checks"
              echo '```'
              grep -E '^(FAIL|  design check failed|world_sanity:|land_share)' sanity.log
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            stress.log
            sanity.log
            world-sanity/manifest.json
            world-sanity/validation.json
            engine/build/linux-headless-asan/ctest-stress-fail-*.log
          if-no-files-found: ignore

  forged-walk:
    name: forged walk bot 256 and 1024 (linux headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ICHOR_NIGHTLY_WALK_GRIDS: ${{ inputs.walk_grids || '256,1024' }}
      ICHOR_NIGHTLY_WALK_BUDGET_S: "1200"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-v2-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-walk-${{ github.sha }}
          restore-keys: |
            ccache-walk-
            ccache-asan-
      # Release without sanitizers: the first run of this job under ASan Debug took about 190 s per seed at grid 1024, so 8 seeds
      # alone overran the budget. Memory errors in the walker are covered by the sanitizer jobs on the PR suite's 129 grid.
      - name: Configure
        run: cmake --preset linux-headless-asan -DCMAKE_BUILD_TYPE=Release -DENGINE_SANITIZERS=OFF
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan --target ichor_tests_world
        working-directory: engine
      - name: Forged walk bot (8 seeds per grid)
        id: walk
        run: |
          set -o pipefail
          engine/build/linux-headless-asan/tests/ichor_tests_world "nightly: the walk bot*" | tee walk.log
      - name: Summarize walk failures
        if: ${{ failure() }}
        run: |
          {
            echo "## Forged walk bot"
            echo '```'
            grep -E '^(WALK|  )|silently stuck|FAILED' walk.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload walk log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-walk-log
          path: walk.log
          if-no-files-found: ignore

  soak:
    # The full variants of the heavy tests (label soak in engine/tests/test_tiers.json) under ASan/UBSan. The stress job above runs
    # every other test, so together the nightly covers the whole suite. Pull requests run the small variants only (SEED-664, SEED-672).
    name: soak tests (linux headless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg
          fetch-depth: 0
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-v2-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-linux-v2-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure
        run: cmake --preset linux-headless-asan
        working-directory: engine
      - name: Build
        run: cmake --build --preset linux-headless-asan
        working-directory: engine
      - name: Soak tests
        run: ctest --preset linux-headless-asan-soak
        working-directory: engine

  regen-fixtures:
    # bin/regen-fixtures --check on a clean tree (SEED-699): every regenerator must reproduce the fixture that is committed, so a
    # hash change is one command, and a regenerator that drifts from its test is caught here instead of on the next intended change.
    # Windows, like the developer machines the fixtures are regenerated on. Restores the PR caches and saves none.
    name: regen-fixtures reproduces the committed fixtures (windows)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg
          fetch-depth: 0
          filter: blob:none
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install sccache
        id: sccache-action
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        if: steps.sccache-action.outcome == 'success'
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-
      - name: Toolchain identity for the vcpkg cache
        id: toolchain
        shell: pwsh
        run: |
          $cl = (Get-FileHash (Get-Command cl.exe).Source -Algorithm SHA256).Hash.Substring(0, 16)
          "id=pwsh$($PSVersionTable.PSVersion)-cl$cl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore vcpkg binaries
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-v3-${{ steps.toolchain.outputs.id }}-${{ hashFiles('engine/vcpkg.json', 'engine/ports/**') }}
          restore-keys: vcpkg-windows-v3-${{ steps.toolchain.outputs.id }}-
      - name: Configure
        run: cmake --preset windows-ci
        working-directory: engine
      - name: Build the regenerators
        run: cmake --build --preset windows-ci --target ichor_tests_world ichor_forge_cli ichor ichor_lint_cli combat_bridge_corpus stage0_corpus
        working-directory: engine
      - name: Regenerate every fixture and compare with the index
        shell: bash
        run: bin/regen-fixtures --no-build --check
