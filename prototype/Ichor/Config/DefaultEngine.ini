[/Script/Engine.RendererSettings]
; Stage 0 renders grey boxes and asks one question: can a wind-up be read. The template
; defaults were paying for Lumen GI, virtual shadow maps and TSR to answer it, which cost
; this machine roughly 50ms a frame - the prototype ran at ~3 fps in the editor viewport
; and 20 fps standalone at 720p, while the same build ticks at 500+ fps headless. At 3 fps
; a frame is 340ms and a 350ms light wind-up begins and ends inside a single frame, so the
; telegraph the whole design rests on was literally never drawn.
;
; None of this is an art-direction decision - doc 16 keeps Lumen for the real game. It is
; off here because a readability test cannot be run at 3 fps. Revert this block to measure
; the real look.
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.Lumen.TraceMeshSDFs=0
r.Shadow.Virtual.Enable=0
r.AntiAliasingMethod=2
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False

