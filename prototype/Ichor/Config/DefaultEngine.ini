[Zen.AutoLaunch]
; UE 5.8 serves the DDC through Zen, whose data dir defaults to %LOCALAPPDATA%.
; In practice the UE-LocalDataCachePath environment variable wins and Zen follows
; it (to <path>/Zen), so this is a fallback for machines without that set. Either
; way, the point is to keep the cache off a small system drive.
DataPath=E:/UnrealDDC/Zen/Data